{{template "header" .}}
<div class="container mx-auto px-4 py-16 flex flex-col items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-gray-100 p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Sign in</h1>
        <p class="text-gray-500 mb-6">Enter your email and we’ll send you a magic link to sign in.</p>
        {{if .Error}}
        <div class="mb-4 p-3 bg-amber-50 border border-amber-200 rounded-lg text-amber-800 text-sm">{{.Error}}</div>
        {{end}}
        <form action="/login" method="POST" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{.CsrfToken}}">
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" required autofocus
                    class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                    placeholder="you@example.com">
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition">
                Send magic link
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-400">
            <a href="/" class="hover:text-indigo-600">← Back to home</a>
        </p>
    </div>
</div>
{{template "footer" .}}
