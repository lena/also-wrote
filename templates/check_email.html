{{template "header" .}}
<div class="container mx-auto px-4 py-16 flex flex-col items-center justify-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-gray-100 p-8 text-center">
        <div class="mb-6 inline-flex items-center justify-center w-16 h-16 rounded-full bg-indigo-100 text-indigo-600">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Check your email</h1>
        <p class="text-gray-500 mb-8">We sent a sign-in link to <strong>{{.Email}}</strong>. Click the link to sign in. It expires in 15 minutes.</p>
        <a href="/" class="text-indigo-600 font-semibold hover:text-indigo-700">← Back to home</a>
    </div>
</div>
{{template "footer" .}}
