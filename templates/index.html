{{template "header" .}}
<div class="flex flex-col items-center justify-center min-h-[60vh]">
    <h1 class="text-5xl font-extrabold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 tracking-tight text-center px-4">
        Who wrote your favorite episode?
    </h1>
    <p class="text-xl text-gray-500 mb-10 text-center max-w-2xl px-4">
        Discover the creative minds behind the TV series you love. Search for a show to see episode-by-episode writing credits.
    </p>
    <div class="w-full max-w-lg px-4">
        <form action="/search" method="GET" class="flex flex-col gap-4 relative">
            <div class="relative group">
                <input type="text" name="q" placeholder="Start typing a show name..." 
                    class="w-full p-5 pl-6 text-lg border border-gray-200 rounded-xl shadow-lg focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 transition duration-300 outline-none group-hover:shadow-xl">
                <div class="absolute right-5 top-1/2 transform -translate-y-1/2 text-gray-400">
                     <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
            <div class="text-center mt-4">
                <span class="text-xs text-gray-400 uppercase tracking-wider font-semibold">Popular Searches</span>
                <div class="flex justify-center gap-2 mt-2 flex-wrap">
                    <a href="/search?q=The+Wire" class="bg-white border border-gray-200 text-gray-600 px-3 py-1 rounded-full text-sm hover:border-indigo-500 hover:text-indigo-600 transition shadow-sm">The Wire</a>
                    <a href="/search?q=Succession" class="bg-white border border-gray-200 text-gray-600 px-3 py-1 rounded-full text-sm hover:border-indigo-500 hover:text-indigo-600 transition shadow-sm">Succession</a>
                    <a href="/search?q=Severance" class="bg-white border border-gray-200 text-gray-600 px-3 py-1 rounded-full text-sm hover:border-indigo-500 hover:text-indigo-600 transition shadow-sm">Severance</a>
                </div>
            </div>
        </form>
    </div>
</div>
{{template "footer" .}}
