{{define "header"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CsrfToken}}">
    <title>Also Wrote</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input, textarea { color: #111827; }
        input::placeholder, textarea::placeholder { color: #9ca3af; }
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        /* Scrollable episode list: hide scrollbar (fade indicates scroll); scrolling still works */
        .episode-list-scroll {
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .episode-list-scroll::-webkit-scrollbar {
            display: none;
        }
        .episode-fade { opacity: 0; transition: opacity 0.2s ease; }
        .episode-list-wrap.has-overflow .episode-fade { opacity: 1; }
        @media (max-width: 640px) {
            #hero-search::placeholder { font-size: 0.875rem; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-slate-800 text-white min-h-screen flex flex-col">
    <!-- Decorative background (same as landing) -->
    <div class="fixed inset-0 overflow-hidden opacity-20 pointer-events-none z-0" aria-hidden="true">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
        <div class="absolute top-1/2 right-0 w-72 h-72 bg-purple-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
        <div class="absolute -bottom-32 left-1/3 w-80 h-80 bg-pink-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
    </div>
    <nav class="relative z-10 bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-indigo-600 tracking-tight flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="2 4 20 14" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M3.5 4.5h17v11h-17v-11z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M10.5 7.8l4 2.2-4 2.2V7.8z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="0.9" d="M5.5 13.8h13" />
                    <circle cx="7.5" cy="13.8" r="0.6" fill="currentColor" stroke="none" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M8.5 15.5l-2 1.2" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15.5 15.5l2 1.2" />
                </svg>
                Also Wrote
            </a>
            <div class="flex items-center gap-4">
            <form action="/search" method="GET" class="flex items-center">
                <div class="relative">
                    <input type="text" name="q" placeholder="Search shows/writers"
                        class="pl-3 pr-8 py-1.5 bg-gray-100 border-transparent rounded-lg text-sm text-gray-900 placeholder-gray-500 focus:ring-2 focus:ring-indigo-500 focus:bg-white focus:border-indigo-500 transition-colors w-48 md:w-64 outline-none">
                    <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-indigo-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </button>
                </div>
            </form>
            {{if .User}}
            <div class="relative group">
                <button type="button" class="flex items-center gap-1.5 pl-1 pr-2 py-1.5 rounded-full hover:bg-gray-100 text-gray-700 transition">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full text-white font-semibold text-sm shrink-0 {{avatarColor .User.Email}}">{{initial .User.Email}}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 group-hover:rotate-180 transition-transform shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                    </svg>
                </button>
                <div class="absolute right-0 top-full mt-1 py-1 min-w-[12rem] max-w-[20rem] bg-white rounded-lg shadow-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50">
                    <a href="/favorite-writers" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-indigo-600">Favorite Writers</a>
                    <form action="/logout" method="POST" class="border-t border-gray-100">
                        <input type="hidden" name="csrf_token" value="{{.CsrfToken}}">
                        <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 hover:text-red-600">Log out <span class="text-gray-500 font-normal">({{.User.Email}})</span></button>
                    </form>
                </div>
            </div>
            {{else}}
            <a href="/login" class="text-sm font-medium text-indigo-600 hover:text-indigo-700">Log in</a>
            {{end}}
            </div>
        </div>
    </nav>
    <main class="relative z-10 flex-grow flex flex-col">
{{end}}
