{{template "header" .}}
<div class="relative min-h-[calc(100vh-theme('spacing.16')-theme('spacing.16'))] flex flex-col items-center justify-center overflow-hidden flex-grow">
    <!-- Decorative background elements -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden opacity-20 pointer-events-none">
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
        <div class="absolute top-1/2 right-0 w-72 h-72 bg-purple-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
        <div class="absolute -bottom-32 left-1/3 w-80 h-80 bg-pink-600 rounded-full blur-3xl mix-blend-multiply filter"></div>
    </div>

    <div class="relative z-10 w-full max-w-4xl px-4 flex flex-col items-center flex-grow justify-center text-center">
        <div class="mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-32 w-32 text-indigo-400 opacity-80 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        </div>

        <h1 class="text-4xl md:text-6xl font-black mb-6 tracking-tight leading-tight">
            {{if .ErrorTitle}}{{.ErrorTitle}}{{else}}Oops! Page Not Found{{end}}
        </h1>

        <p class="text-xl text-slate-300 mb-12 max-w-2xl font-light">
            {{if .ErrorMessage}}{{.ErrorMessage}}{{else}}We couldn't find the page you're looking for. It might have been moved or deleted.{{end}}
        </p>

        <a href="/" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full px-8 py-4 font-bold transition duration-300 flex items-center justify-center shadow-lg hover:shadow-indigo-500/30">
            Return Home
        </a>
    </div>
</div>
{{template "footer" .}}
