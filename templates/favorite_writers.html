{{template "header" .}}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold text-white mb-2">Favorite Writers</h1>
    <p class="text-slate-300 mb-8">Writers you’ve favorited. Click to visit their page.</p>
    {{if .Writers}}
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
        {{range .Writers}}
        <a href="/writer?id={{.ID}}" class="group block text-center">
            <div class="aspect-[2/3] rounded-xl overflow-hidden bg-slate-700 mb-3 shadow-md group-hover:shadow-lg transition">
                {{if .ProfilePath}}
                <img src="https://image.tmdb.org/t/p/h632{{.ProfilePath}}" alt="{{.Name}}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                {{else}}
                <div class="w-full h-full flex items-center justify-center text-slate-400 text-4xl">?</div>
                {{end}}
            </div>
            <span class="font-semibold text-white group-hover:text-indigo-300 transition">{{.Name}}</span>
        </a>
        {{end}}
    </div>
    {{else}}
    <div class="bg-white/10 rounded-xl border border-slate-600 p-12 text-center">
        <p class="text-slate-300 mb-4">You haven’t favorited any writers yet.</p>
        <a href="/" class="text-indigo-400 font-semibold hover:text-indigo-300">Discover writers →</a>
    </div>
    {{end}}
</div>
{{template "footer" .}}
