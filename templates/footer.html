{{define "footer"}}
    </main>
    <footer class="bg-white border-t py-8">
        <div class="container mx-auto px-4 text-center text-gray-400 text-sm">
            <p>Also Wrote by Lena Feldberg &copy; 2026. Data provided by <a href="https://www.themoviedb.org/" target="_blank" class="hover:text-indigo-500 underline">TMDB</a></p>
        </div>
    </footer>
    <script>
        document.querySelectorAll('.episode-list-wrap').forEach(function(wrap) {
            var list = wrap.querySelector('.episode-list-scroll');
            if (list && list.scrollHeight > list.clientHeight) {
                wrap.classList.add('has-overflow');
            }
        });
        (function() {
            var el = document.getElementById('hero-search');
            if (!el) return;
            var short = el.getAttribute('data-placeholder-short');
            var long_ = el.getAttribute('data-placeholder-long');
            function setPlaceholder() {
                el.placeholder = window.matchMedia('(max-width: 640px)').matches ? short : long_;
            }
            setPlaceholder();
            window.addEventListener('resize', setPlaceholder);
        })();
    </script>
</body>
</html>
{{end}}
