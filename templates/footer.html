{{define "footer"}}
    </main>
    <footer class="relative z-10 bg-slate-800/90 border-t border-slate-700 py-8">
        <div class="container mx-auto px-4 text-center text-slate-400 text-sm">
            <p>Also Wrote by Lena Feldberg &copy; 2026. Data provided by <a href="https://www.themoviedb.org/" target="_blank" class="hover:text-indigo-400 underline">TMDB</a></p>
        </div>
    </footer>
    <script>
        (function() {
            function updateEpisodeListFades(wrap) {
                var scrollEl = wrap.querySelector('.episode-list-scroll');
                var topFade = wrap.querySelector('.episode-fade-top');
                var bottomFade = wrap.querySelector('.episode-fade-bottom');
                if (!scrollEl || !topFade || !bottomFade) return;
                var atTop = scrollEl.scrollTop <= 1;
                var atBottom = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 1;
                topFade.style.opacity = atTop ? '0' : '1';
                bottomFade.style.opacity = atBottom ? '0' : '1';
            }
            document.querySelectorAll('.episode-list-wrap').forEach(function(wrap) {
                var scrollEl = wrap.querySelector('.episode-list-scroll');
                if (!scrollEl) return;
                scrollEl.addEventListener('scroll', function() { updateEpisodeListFades(wrap); });
                var ro = typeof ResizeObserver !== 'undefined' && new ResizeObserver(function() { updateEpisodeListFades(wrap); });
                if (ro) ro.observe(scrollEl);
                updateEpisodeListFades(wrap);
            });
        })();
        (function() {
            var el = document.getElementById('hero-search');
            if (!el) return;
            var short = el.getAttribute('data-placeholder-short');
            var long_ = el.getAttribute('data-placeholder-long');
            function setPlaceholder() {
                el.placeholder = window.matchMedia('(max-width: 640px)').matches ? short : long_;
            }
            setPlaceholder();
            window.addEventListener('resize', setPlaceholder);
        })();
    </script>
</body>
</html>
{{end}}
