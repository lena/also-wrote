{{template "header" .}}
<div class="container mx-auto px-4">
    <div class="mb-8 border-b pb-4">
        <h2 class="text-3xl font-bold text-gray-800">Results for "<span class="text-indigo-600">{{.Query}}</span>"</h2>
        <p class="text-gray-500 mt-2">Found {{len .Results}} shows matching your search.</p>
    </div>
    
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-8">
        {{range .Results}}
        <a href="/show?id={{.ID}}" class="group block bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300">
            <div class="relative overflow-hidden aspect-[2/3]">
                {{if .PosterPath}}
                <img src="https://image.tmdb.org/t/p/w500{{.PosterPath}}" alt="{{.Name}}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                {{else}}
                <div class="w-full h-full bg-gray-100 flex flex-col items-center justify-center text-gray-400 p-4 text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span class="text-sm font-medium">No Poster</span>
                </div>
                {{end}}
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex items-end p-4">
                    <span class="text-white font-semibold text-sm">View Details &rarr;</span>
                </div>
            </div>
            <div class="p-4">
                <h3 class="font-bold text-lg mb-1 leading-tight text-gray-900 group-hover:text-indigo-600 transition">{{.Name}}</h3>
                <p class="text-sm text-gray-500 font-medium">{{.FirstAirDate}}</p>
            </div>
        </a>
        {{end}}
    </div>
</div>
{{template "footer" .}}
