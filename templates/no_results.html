{{template "header" .}}
<div class="container mx-auto px-4 py-8">
<div class="flex flex-col items-center justify-center min-h-[50vh] text-center px-4">
    <div class="bg-gray-100 rounded-full p-6 mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
    </div>
    <h2 class="text-3xl font-bold text-gray-800 mb-2">No Results Found</h2>
    <p class="text-gray-500 mb-8 max-w-md">We couldn't find any TV shows matching "<strong>{{.Query}}</strong>". Try searching for a different title.</p>
    
    <a href="/" class="bg-indigo-600 text-white px-6 py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-md">
        Back to Search
    </a>
</div>
</div>
{{template "footer" .}}
